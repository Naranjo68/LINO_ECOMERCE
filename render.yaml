services:
  - type: web
    name: lino-ecomerce-api
    runtime: node
    region: virginia
    plan: free
    buildCommand: npm ci
    startCommand: npm run db:init && npm run start:api
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: LINO_SESSION_SECRET
        generateValue: true
